{% extends 'main/base.html' %}
{% block content %}
<a href="{% url 'index' %}">Home</a>
<h1>{{ article.title }}</h1>
<h3>created at {{ article.createdAt }}</h3>
<h4> written by: {% for author in article.authors.all %}
    <a href="{% url 'get_author' author.id %}">
        {{ author }},
    </a>
    {% endfor %}
</h4>
<p>
    {{ article.content }}
</p>



{% endblock %}
